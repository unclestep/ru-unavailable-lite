name: build

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "LICENSE"

permissions:
  contents: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Set release metadata
        run: |
          TAG="$(date -u +%Y%m%d%H%M)"
          echo "TAG_NAME=${TAG}" >> "$GITHUB_ENV"
          echo "RELEASE_NAME=Released on ${TAG}" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          project_id: rkn-block-filtering
          workload_identity_provider: projects/500205253986/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: crux-bigquery-reader@rkn-block-filtering.iam.gserviceaccount.com

      - name: Fetch CrUX snapshot
        run: PYTHONPATH=src python -m rustrict.build --stage crux --work-dir work

      - name: Scrub GCP credentials before untrusted crawl
        run: |
          rm -f "${GOOGLE_APPLICATION_CREDENTIALS:-}" gha-creds-*.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=" >> "$GITHUB_ENV"

      - name: Restore probe and RDAP caches
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            work/probe-cache.json.gz
            work/rdap-cache.json.gz
          key: probe-rdap-cache-${{ env.TAG_NAME }}
          restore-keys: |
            probe-rdap-cache-

      - name: Cache fastembed ONNX model
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/fastembed
          key: fastembed-multilingual-minilm-v1

      - name: Build lists and artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FASTEMBED_CACHE_PATH: /home/runner/.cache/fastembed
        run: |
          PYTHONPATH=src python -m rustrict.build \
            --stage build \
            --work-dir work \
            --out-dir publish \
            --allowlist allowlist.txt \
            --cache-file work/probe-cache.json.gz \
            --rdap-cache work/rdap-cache.json.gz \
            --version "$TAG_NAME"

      - name: Upload scoring audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scoring-audit
          path: work/audit.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Verify output
        run: |
          test -s publish/geosite.dat
          test -s publish/geoip.dat
          test -s publish/split-rules.json
          test -s publish/ru-blocked.txt
          test -s publish/ru-forbidden.txt
          (cd publish && sha256sum -c checksums.sha256sum)
          cat publish/stats.json
          ls -lh publish/

      - name: Release and upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$TAG_NAME" publish/* \
            --title "$RELEASE_NAME" \
            --notes ""

      - name: Push assets to release branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd publish
          git init
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b release
          git add .
          git commit -m "$RELEASE_NAME"
          git remote add origin "https://${GH_ACTOR}:${GH_TOKEN}@github.com/${GH_REPO}"
          git push -f -u origin release
